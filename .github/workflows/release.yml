# Publishes a plugin update whenever the default branch has a plugin version that isn't released yet.
#
# To ship an update: change the code, bump the version in BOTH places in cheri-gallery/cheri-gallery.php
# (the "Version:" header and CG_VERSION), add a "## x.y.z" section to CHANGELOG.md, and get it onto the
# default branch. This workflow then builds cheri-gallery.zip and publishes release vx.y.z. Sites running
# Cheri Gallery see the update within 12 hours, or straight away with Settings → Check for updates now.
name: Release plugin

on:
  push:
    paths:
      - 'cheri-gallery/**'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the plugin version
        id: version
        run: |
          header=$(grep -m1 -E '^\s*\*\s*Version:' cheri-gallery/cheri-gallery.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          constant=$(grep -m1 "define( 'CG_VERSION'" cheri-gallery/cheri-gallery.php | sed -E "s/.*'CG_VERSION', '([^']+)'.*/\1/")
          echo "header=$header constant=$constant"
          if [ "$header" != "$constant" ]; then
            echo "::error::The Version header ($header) and CG_VERSION ($constant) in cheri-gallery.php must match."
            exit 1
          fi
          echo "version=$header" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.version.outputs.version }}"
          draft=$(gh release view "$v" --json isDraft -q .isDraft 2>/dev/null || echo "none")
          if [ "$draft" = "false" ]; then
            echo "Version $v is already released; bump the version to publish an update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$draft" = "true" ]; then
            echo "Removing an unfinished draft of $v left by an earlier failed run."
            gh release delete "$v" --yes --cleanup-tag || true
          fi

      - name: Syntax-check every PHP file
        if: steps.exists.outputs.skip != 'true'
        run: find cheri-gallery -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build cheri-gallery.zip
        if: steps.exists.outputs.skip != 'true'
        run: git archive --format=zip --output=cheri-gallery.zip HEAD cheri-gallery

      - name: Release notes from CHANGELOG.md
        if: steps.exists.outputs.skip != 'true'
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then git log -1 --format=%B > notes.md; fi
          cat notes.md

      - name: Build release.json (what sites read to find updates, without the rate-limited API)
        if: steps.exists.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import json, datetime
          json.dump({
              "version": "${{ steps.version.outputs.version }}",
              "notes": open("notes.md").read().strip(),
              "published": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, open("release.json", "w"))
          PY
          cat release.json

      - name: Publish the release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # GitHub occasionally answers 500; clear any half-made draft and try again.
          for attempt in 1 2 3; do
            if gh release create "v$v" cheri-gallery.zip release.json \
                --target "$GITHUB_SHA" \
                --title "Cheri Gallery $v" \
                --notes-file notes.md \
                --latest; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 15))s"
            gh release delete "v$v" --yes --cleanup-tag 2>/dev/null || true
            sleep $((attempt * 15))
          done
          exit 1
