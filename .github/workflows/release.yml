# Publishes a plugin update. Push a tag like v0.2.1 and this builds cheri-gallery.zip and
# attaches it to a GitHub release. Sites running Cheri Gallery see the update within 12 hours
# (or straight away with Settings → Check for updates now).
name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -E '^\s*\*\s*Version:' cheri-gallery/cheri-gallery.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          constant=$(grep -m1 "define( 'CG_VERSION'" cheri-gallery/cheri-gallery.php | sed -E "s/.*'CG_VERSION', '([^']+)'.*/\1/")
          echo "tag=$tag header=$header constant=$constant"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ]; then
            echo "::error::Tag v$tag doesn't match the plugin version (header $header, CG_VERSION $constant). Update both in cheri-gallery.php."
            exit 1
          fi

      - name: Syntax-check every PHP file
        run: find cheri-gallery -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build cheri-gallery.zip
        run: git archive --format=zip --output=cheri-gallery.zip HEAD cheri-gallery

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cheri-gallery.zip \
            --title "Cheri Gallery $GITHUB_REF_NAME" \
            --notes-file <(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d') \
            --latest
